<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content ="width=device-width,initial-scale=1.0">
    <title>Expense Tracker Dashboard</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#333;
        }

        .form-group{
            display:grid;
            grid-template-columns:1fr 1fr 1fr auto;
            gap:10px;
            margin-bottom:25px;
        }

        input{
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
        }


        button{
        padding:12px 20px;
        border:none;
        background:#667eea;
        color:white;
        border-radius:8px;
        cursor:pointer;
        }

        button:hover{
           background:#5a67d8;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table th,
        table td{
            padding:12px;
            border:1px solid #ddd;
            text-align:center;
        }

        table th{
            background: #667eea;
            color:white;
        }

        .summary{
            margin-top:20px;
            padding:15px;
            background:#eef2ff;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
        }

        .delete-btn{
            background:red;
            padding:8px 12px;
            border:none;
            color:white;
            border-radius:6px;
            cursor:pointer;
        }

    </style>

</head>

<body>
    <div class="container">

        <button onclick="logout()" style="float:right; width:auto; margin-bottom:10px">Logout</button>

        <h1> Expense Tracker Dashboard</h1>

        <!--Add Expense Form-->

        <div class="form-group">
            <input type="text" id="expenseName" placeholder="Expense Name">

            <input type="number" id="expenseAmount" placeholder="Amount">

            <input type="date" id="expenseDate" placeholder="Date">

            <button onclick ="addExpense()">Add</button>

        </div>

        <!--Expense Table-->
        <table>

            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseTableBody">

            </tbody>
        </table>

        <!--Summary-->
        <div class="summary">
            Total Expense : ₹<span id="totalAmount">0</span>
        
        </div>
    </div>

    <script>

        function logout(){
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }
       const token= localStorage.getItem('token');
       
       if(!token) window.location.href = 'index.html';

    async function addExpense(){
        let title = document.getElementById("expenseName").value;
        let amount = document.getElementById("expenseAmount").value;
        let date = document.getElementById("expenseDate").value;

        if(title === "" || amount === "" || date === ""){
            alert("Please fill all fields");
            return;
        }

        const response = await fetch('https://expense-tracker-production-e694.up.railway.app/api/expenses',{
            method: 'POST',
            headers: {
                'Content-Type':'application/json',
                'Authorization': `Bearer ${token}`

            },
            body: JSON.stringify({title,amount:parseFloat(amount), type:'expense',date})

        });

        if(response.ok){
            document.getElementById("expenseName").value="";
            document.getElementById("expenseAmount").value="";
            document.getElementById("expenseDate").value="";
            loadExpenses();
        }
         
       }
    async function loadExpenses(){
        const response = await fetch('https://expense-tracker-production-e694.up.railway.app/api/expenses', {
        headers: { 'Authorization': `Bearer ${token}` }
    });

       const expenses = await response.json();
       let tableBody = document.getElementById("expenseTableBody");
       tableBody.innerHTML = "";
       let total =0;

       expenses.forEach((expense)=> {
        total+= expense.amount;
        tableBody.innerHTML += `
         <tr>
            <td>${expense.title}</td>
            <td>₹${expense.amount}</td>
            <td>${expense.date.split('T')[0]}</td>
            <td>
                <button class="delete-btn" onclick="deleteExpense('${expense._id}')">Delete</button>
            </td>
         </tr>
        `;
       });
    

       document.getElementById("totalAmount").innerText=total;
    }
    async function deleteExpense(id){
        await fetch(`https://expense-tracker-production-e694.up.railway.app/api/expenses/${id}`,{
            method:'DELETE',
            headers:{ 'Authorization': `Bearer ${token}` }
         });

         loadExpenses();
    }

    loadExpenses();

    </script>
</body>
</html>
